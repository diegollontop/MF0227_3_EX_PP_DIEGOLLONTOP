{% extends 'incidencias/base.html' %}

{% block title %}Nueva Incidencia{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Registrar Nueva Incidencia</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-flex justify-content-end gap-2 mt-3">
                        <a href="{% url 'lista_incidencias' %}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-success">Guardar Incidencia</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
